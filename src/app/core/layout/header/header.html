<nav class="header" [class.header--inverted]="isHeaderInverted()" [class.header--contact]="isInContactSection()" [class.header--hidden]="isHeaderHidden()">
  <a [routerLink]="['/', lang()]" fragment="" (click)="scrollToTop()" class="header__link">
    <img class="header__logo" src="logo.webp" alt="Logo" />
  </a>

  <a class="header__nav-link header__nav-link--about"
     [routerLink]="['/', lang()]" fragment="about"
     (click)="scrollToSection('about')">{{ 'nav.about' | translate }}</a>
  <a class="header__nav-link header__nav-link--skills"
     [routerLink]="['/', lang()]" fragment="skills"
     (click)="scrollToSection('skills')">{{ 'nav.skills' | translate }}</a>
  <a class="header__nav-link header__nav-link--projects"
     [routerLink]="['/', lang()]" fragment="projects"
     (click)="scrollToSection('projects')">{{ 'nav.projects' | translate }}</a>
  <a class="header__nav-link header__nav-link--contact"
     [routerLink]="['/', lang()]" fragment="contact"
     (click)="scrollToSection('contact')">{{ 'nav.contact' | translate }}</a>

  <button
    class="header__lang-toggle"
    [class.header__lang-toggle--english]="isEnglish()"
    (click)="toggleLanguage()"
    [attr.aria-label]="(isEnglish() ? 'nav.switchToGerman' : 'nav.switchToEnglish') | translate"
  >
    <img
      [src]="toggleIcon()"
      [alt]="(isEnglish() ? 'nav.switchToGerman' : 'nav.switchToEnglish') | translate"
    />
  </button>

  <button class="header__toggle" (click)="toggleMenu()" aria-label="Toggle Menu">
    @if (isMenuOpen()) {
      <img
        class="header__menu-icon"
        src="design-material/00_Hand-drawn lines/00_Header/Menu - Mobile icon/hamburger-close.png"
        alt="Menu"
      />
    } @else {
      <img
        class="header__menu-icon header--invert"
        src="design-material/00_Hand-drawn lines/00_Header/Menu - Mobile icon/hamburger-default.svg"
        alt="Menu"
      />
    }
  </button>
</nav>
