<!-- hero component/section -------------------------------------------------------------------------------------->

<section class="hero">
  <img
    ngSrc="/design-material/01_Background/design-size-relation/01_Hero_mobile.webp"
    priority
    fill
    alt="Background"
  />

  <header class="hero__title">
    <div class="hero__world-row">
      <button
        class="btn-primary btn-primary--world"
        (click)="toggleSound()"
        [attr.aria-pressed]="soundOn()"
        [attr.aria-label]="(soundOn() ? 'hero.soundOff' : 'hero.soundOn') | translate"
      >
        <span class="btn-primary__default">{{ 'hero.helloWorld' | translate }}</span>
        <span class="btn-primary__hover">{{ 'hero.name' | translate }}</span>
        @if (soundOn()) {
          <span class="btn-primary__bell" aria-hidden="true">
            <svg viewBox="0 0 24 24">
              <path
                fill="currentColor"
                d="M12 2a1 1 0 0 1 1 1v.6a6 6 0 0 1 5 5.9V14l1.7 1.7a1 1 0 0 1-.7 1.7H5a1 1 0 0 1-.7-1.7L6 14V9.5a6 6 0 0 1 5-5.9V3a1 1 0 0 1 1-1Zm0 20a2.5 2.5 0 0 1-2.45-2h4.9A2.5 2.5 0 0 1 12 22Z"
              />
            </svg>
          </span>
        } @else {
          <img class="btn-primary__wave" src="/design-material/03_Stickers/waving_hand.png" alt="Waving hand" />
        }
      </button>
    </div>

    <h1 class="visually-hidden">Frontend Developer</h1>

    <div class="hero__frontend-row">
      <span class="hero__text hero__text--frontend" aria-hidden="true">
        @for (item of frontendLetters(); track $index) {<span
          (mouseenter)="playNote($index)"
          [attr.data-word]="item.word"
          [attr.data-hover]="$first ? item.letter.toLowerCase() : item.letter.toUpperCase()">{{ item.letter }}</span>}
      </span>
    </div>

    <div class="hero__developer-row">
      <span class="hero__text hero__text--developer" aria-hidden="true">
        @for (item of developerLetters(); track $index) {<span
          (mouseenter)="playNote($index + 8)"
          [attr.data-word]="item.word"
          [attr.data-hover]="item.letter.toLowerCase()">{{ item.letter }}</span>}
      </span>
      <button class="btn-primary btn-primary--talk" (click)="scrollToContact()">
        {{ 'hero.getInTouch' | translate }}
      </button>

      <figure class="hero__polaroid" aria-label="Polaroid photo">
        <img class="hero__polaroid-frame" src="/design-material/03_Stickers/polaroid-frame.webp" alt="" aria-hidden="true"/>
        <img class="hero__polaroid-photo" src="/design-material/03_Stickers/Behmer_0426.jpg" alt="Portrait photo"/>
        <figcaption class="hero__polaroid-caption">
          <span class="hero__polaroid-caption-default">{{ 'hero.polaroidCaption' | translate }}</span>
          <span class="hero__polaroid-caption-hover">{{ 'hero.polaroidCaptionHover' | translate }}</span>
        </figcaption>
      </figure>
    </div>
  </header>

  <nav class="hero__contact">
    <a class="contact__link" href="https://www.linkedin.com/in/patrick-schauer-5a369322a" target="_blank">
      <img src="/icons/contact/linkedin.svg" alt="LinkedIn" />
    </a>
    <a class="contact__link" href="https://github.com/Patshakeitout" target="_blank">
      <img src="/icons/contact/github.svg" alt="GitHub" />
    </a>
    <a class="contact__link" href="mailto:patrick_schauer@t-online.de" target="_blank">
      <img src="/icons/contact/mail.svg" alt="Email" />
    </a>
  </nav>
</section>
