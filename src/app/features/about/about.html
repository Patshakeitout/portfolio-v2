<!-- About component / section --------------------------------------------------------->

<section class="about">
  <div class="about__content">
    <header class="about__header">
      <p class="about__subtitle">{{ 'about.subtitle' | translate }}</p>
      <h1 class="about__title">{{ 'about.title' | translate }}</h1>

      <article class="about__article">
        <p>{{ 'about.paragraph1' | translate }}</p>
        <p>{{ 'about.paragraph2' | translate }}</p>

        <button class="btn-primary" (click)="scrollToContact()">{{ 'about.cta' | translate }}</button>
      </article>
    </header>

    <ul class="job-conditions" aria-label="Job conditions">
      <li class="job-conditions__item">
        <img
          class="job-conditions__icon"
          src="icons/work-cond/relocation.svg"
          alt=""
          aria-hidden="true"
        />
        <img
          class="job-conditions__paper"
          src="design-material/02_Ripped Paper/Option 3/Mobile/About me 6.png"
          alt=""
          aria-hidden="true"
        />
        <span class="job-conditions__label">{{ 'about.location' | translate }}</span>
      </li>
      <li class="job-conditions__item">
        <img
          class="job-conditions__icon"
          src="icons/work-cond/hybrid-remote-onsite.svg"
          alt=""
          aria-hidden="true"
        />
        <img
          class="job-conditions__paper"
          src="design-material/02_Ripped Paper/Option 3/Mobile/About me 4.png"
          alt=""
          aria-hidden="true"
        />
        <span class="job-conditions__label">{{ 'about.workMode' | translate }}</span>
      </li>
    </ul>
  </div>
</section>
