<!-- mobile-menu.html --->

@if (isOpen()) {
  <section class="mobile-menu">
    <img
      ngSrc="/design-material/01_Background/design-size-relation/07_menu_mobile.webp"
      class="bg"
      fill
      loading="lazy"
      alt="Background"
    />

    <nav class="nav">
      <a class="nav--about" [routerLink]="['/', lang()]" fragment="about" (click)="scrollToSection($event)">{{ 'nav.about' | translate }}</a>
      <a class="nav--skills" [routerLink]="['/', lang()]" fragment="skills" (click)="scrollToSection($event)">{{ 'nav.skills' | translate }}</a>
      <a class="nav--projects" [routerLink]="['/', lang()]" fragment="projects" (click)="scrollToSection($event)">{{ 'nav.projects' | translate }}</a>
      <a class="nav--contact" [routerLink]="['/', lang()]" fragment="contact" (click)="scrollToSection($event)">{{ 'nav.contact' | translate }}</a>

      <button
        class="nav__toggle"
        [class.nav__toggle--english]="isEnglish()"
        (click)="toggleLanguage()"
        [attr.aria-label]="(isEnglish() ? 'nav.switchToGerman' : 'nav.switchToEnglish') | translate"
      >
        <img
          [src]="isEnglish() ? '/icons/ui/toggle-lg-left.png' : '/icons/ui/toggle-lg-right.png'"
          [alt]="(isEnglish() ? 'nav.switchToGerman' : 'nav.switchToEnglish') | translate"
        />
      </button>
    </nav>

    <nav class="contact">
      <a class="contact__link" href="www.linkedin.com/in/patrick-schauer-5a369322a">
        <img src="/icons/contact/linkedin.svg" />
      </a>
      <a class="contact__link" href="https://github.com/Patshakeitout">
        <img src="/icons/contact/github.svg" />
      </a>
      <a class="contact__link" href="mailto:patrick_schauer@t-online.de">
        <img src="/icons/contact/mail.svg" />
      </a>
    </nav>
  </section>
}
